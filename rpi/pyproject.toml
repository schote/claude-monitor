[project]
name = "claude-usage-daemon"
version = "0.1.0"
description = "Serves Claude 5-hour and weekly usage to an ESP32 display"
requires-python = ">=3.11"          # tomllib
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.scripts]
claude-usage-daemon = "usage_daemon:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Single module, no package directory.
include = ["usage_daemon.py"]
